# Docker Compose for Milvus Standalone Setup
# ------------------------------------------
# Services included:
#   - Milvus       : Vector database for embeddings
#   - MinIO        : S3-compatible object storage
#   - etcd         : Metadata storage for Milvus
# Reference:
#   https://milvus.io/docs/v2.2.x/install_standalone-docker.md#Download-the-YAML-file

version: "3.5"

services:
  etcd:
    container_name: mavenir-rag-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: mavenir-rag-milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # Open CORS so browsers can follow presigned GETs from any frontend
      # origin. Presigned URLs are themselves the access capability, so this
      # adds no extra exposure. Restrict by setting a comma-separated origin
      # list (e.g. "https://app.example.com").
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9003:9001"
      - "9002:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: mavenir-rag-milvus-standalone
    # Note: Use the latest Milvus docker image to make use of "Group Search"
    image: milvusdb/milvus:v2.6.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19531:19530"
      - "9092:9091"
    depends_on:
      - "etcd"
      - "minio"
  
  redis:
    container_name: mavenir-rag-redis
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    restart: always

networks:
  default:
    name: mavenir-rag-milvus
